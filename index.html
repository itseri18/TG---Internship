<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TGFSI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="split-screen">
        <div class="left-panel">
            <div class="logo-section">
    <img src="Assets/logo.png" alt="ProTech Logo" class="brand-logo">
</div>
            <div class="quote-section">
                <blockquote>"Providing your business with better solutions."</blockquote>
                <span>— Lex Carreon | CEO</span>
            </div>
        </div>

        <div class="right-panel">
            <form id="loginForm">
                <h2>Welcome <span class="highlight">Back</span></h2>
                <p>Access your professional dashboard</p>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@example.com" required>
                    <span id="emailError" class="error-msg">Please enter a valid email.</span>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="toggle-password" id="eyeIcon">👁</span>
                    <span id="passError" class="error-msg">Password must be at least 6 characters.</span>
                </div>
                
                <script>
                    const passwordInput = document.getElementById('password');
                    const eyeIcon = document.getElementById('eyeIcon');

                    eyeIcon.addEventListener('click', function () {
                        // Toggle the type attribute
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        
                        // Optional: Change the icon look when clicked
                        this.style.color = type === 'text' ? '#FF8C00' : '#B3B3B3';
                    });

                    // Keep your existing validation logic here...
                </script>

                <button type="submit" class="btn-primary">Login</button>
                <p class="switch-text">New here? <a href="register.html">Register</a></p>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent the form from actually submitting to a server
            
            let valid = true;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset errors
            document.querySelectorAll('.error-msg').forEach(msg => msg.style.display = 'none');

            // Simple Logic Validation
            if (!email.includes('@')) {
                document.getElementById('emailError').style.display = 'block';
                valid = false;
            }
            if (password.length < 6) {
                document.getElementById('passError').style.display = 'block';
                valid = false;
            }

            // --- NEW REDIRECTION LOGIC ---
            if (valid) {
                // This sends the user to your new PR Tracker page!
                window.location.href = "Dashboard_PRTracker.html";
            }
        });
    </script>
</body>
</html>
