<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | TGFSI</title>
    <link rel="stylesheet" href="Profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-left">
            <img src="Assets/logo.png" alt="" class="header-logo">
        </div>
        <div class="header-right">
            <div class="dropdown-container" id="notifDropdown">
                <i class="fa-solid fa-bell notification-icon"></i>
                <div class="dropdown-menu">
                    <div class="dropdown-item">No new notifications</div>
                </div>
            </div>

            <div class="profile-icon dropdown-container" id="profileDropdown">
                <i class="fa-solid fa-circle-user"></i>
                <div class="dropdown-menu">
                    <a href="Profile.html" class="dropdown-item"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="Calendar.html" class="dropdown-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
                    <a href="index.html" class="dropdown-item"><i class="fa-solid fa-right-from-bracket"></i> Log-out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <nav class="side-nav">
                <div class="menu-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="Dashboard_PRTracker.html">PR tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_POTracker.html">PO Tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_Payment.html">Payment</a></div>
                <div class="sub-menu"><a href="Dashboard_Savings.html">Savings</a></div>
                <div class="sub-menu"><a href="Dashboard_DeliveryTracker.html">Delivery Tracker</a></div>

                <div class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <a href="Supplier.html">Supplier</a>
                </div>
                
                <div class="menu-item">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>Inventory</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="#">YTD</a></div>
                <div class="sub-menu"><a href="#">Products</a></div>
                <div class="sub-menu"><a href="#">Stock In</a></div>
                <div class="sub-menu"><a href="#">Stock Out</a></div>
                <div class="sub-menu"><a href="#">Pull-Out Supplies</a></div>
            </nav>
        </aside>

        <main class="content-area">
            <h2 style="margin-bottom: 30px;">
                <span style="color: var(--primary-orange);">■</span> <span id="page-title">Profile</span>
            </h2>

          <form id="profileForm" class="profile-card">
    <div class="profile-left">
        <div class="avatar-wrapper" id="avatarClickArea" style="cursor: pointer;">
            <div class="camera-overlay"><i class="fa-solid fa-camera"></i></div>
            <img src="Assets/Gemini_Generated_Image_fn585mfn585mfn58.png" id="profileDisplay" alt="Profile Image">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </div>

        <div class="button-group-left">
            <button type="submit" class="btn-save" id="saveBtn">SAVE</button>
            <button type="button" class="btn-cancel" onclick="window.location.reload()">CANCEL</button>
        </div>
    </div>

    <div class="profile-right">
        <div class="input-row">
            <label>Name:</label>
            <input type="text" id="userName" placeholder="Enter your full name" required>
        </div>
        <div class="input-row">
            <label>Email:</label>
            <input type="email" id="userEmail" placeholder="Enter your email address" required>
        </div>
        <div class="input-row">
            <label>Phone Number:</label>
            <input type="tel" id="userPhone" placeholder="Enter your phone number" required>
        </div>
        <div class="input-row">
            <label>Address:</label>
            <input type="text" id="userAddress" placeholder="Enter your complete address" required>
        </div>

        <div class="button-group-right">
            <button type="button" id="editBtn" class="btn-save">EDIT PROFILE</button>
        </div>
    </div>
</form>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Elements ---
    const imageInput = document.getElementById('imageInput');
    const profileDisplay = document.getElementById('profileDisplay');
    const avatarClickArea = document.getElementById('avatarClickArea');
    const saveBtn = document.getElementById('saveBtn');
    const editBtn = document.getElementById('editBtn');
    
    // Select all inputs
    const inputs = [
        document.getElementById('userName'),
        document.getElementById('userEmail'),
        document.getElementById('userPhone'),
        document.getElementById('userAddress')
    ];

    // --- 1. INITIAL STATE ---
    // Ensure all fields are locked when the page loads
    inputs.forEach(input => {
        if(input) input.disabled = true;
    });

    // --- 2. EDIT PROFILE BUTTON (FIXED) ---
    editBtn.addEventListener('click', (e) => {
        e.preventDefault(); 
        
        // Check state of the first element in the array
        const currentlyDisabled = inputs.disabled;
        
        if (currentlyDisabled) {
            // UNLOCK FIELDS
            inputs.forEach(field => {
                if(field) field.disabled = false;
            });
            editBtn.innerText = "LOCK FIELDS";
            inputs.focus(); // Focus on the name field
        } else {
            // LOCK FIELDS
            inputs.forEach(field => {
                if(field) field.disabled = true;
            });
            editBtn.innerText = "EDIT PROFILE";
        }
    });

    // --- 3. IMAGE UPLOAD (FIXED) ---
    avatarClickArea.addEventListener('click', () => {
        imageInput.click(); 
    });

    imageInput.addEventListener('change', function(e) {
        // Access the first file specifically
        const file = e.target.files; 
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                profileDisplay.src = event.target.result; 
            };
            reader.readAsDataURL(file);
        }
    });

    // --- 4. SAVE BUTTON ---
    saveBtn.addEventListener('click', (e) => {
        e.preventDefault(); 

        const name = document.getElementById('userName').value;
        const email = document.getElementById('userEmail').value;
        const phone = document.getElementById('userPhone').value;

        if (!name || !email || !phone) {
            return alert("Please fill in the required fields.");
        }

        saveBtn.innerText = "SAVING...";
        saveBtn.disabled = true;

        setTimeout(() => {
            alert("Profile updated successfully!");
            saveBtn.innerText = "SAVE";
            saveBtn.disabled = false;
            
            // Re-lock fields after saving
            inputs.forEach(input => { if(input) input.disabled = true; });
            editBtn.innerText = "EDIT PROFILE";
        }, 800);
    });

    // --- 5. SIDEBAR & DROPDOWN LOGIC ---
    document.querySelectorAll('.side-nav .menu-item').forEach(item => {
        let next = item.nextElementSibling;
        while (next && next.classList.contains('sub-menu')) {
            next.style.display = 'none';
            next = next.nextElementSibling;
        }

        item.addEventListener('click', function() {
            const caret = this.querySelector('.caret');
            if (caret) {
                caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
            }
            let sub = this.nextElementSibling;
            while (sub && sub.classList.contains('sub-menu')) {
                sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
                sub = sub.nextElementSibling;
            }
        });
    });

    const profileBtn = document.getElementById('profileDropdown');
    const notifBtn = document.getElementById('notifDropdown');

    if(profileBtn) profileBtn.onclick = (e) => {
        e.stopPropagation();
        profileBtn.querySelector('.dropdown-menu').classList.toggle('show');
    };

    window.onclick = () => {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
    };
});
</script>

<style>
/* Essential fix for dropdown visibility */
.dropdown-menu.show {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
}
</style>

</body>
</html>
