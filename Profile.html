<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | TGFSI</title>
    <link rel="stylesheet" href="Profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-left">
            <img src="Assets/logo.png" alt="" class="header-logo">
        </div>
        <div class="header-right">
            <div class="dropdown-container" id="notifDropdown">
                <i class="fa-solid fa-bell notification-icon"></i>
                <div class="dropdown-menu">
                    <div class="dropdown-item">No new notifications</div>
                </div>
            </div>

            <div class="profile-icon dropdown-container" id="profileDropdown">
                <i class="fa-solid fa-circle-user"></i>
                <div class="dropdown-menu">
                    <a href="Profile.html" class="dropdown-item"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="Calendar.html" class="dropdown-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
                    <a href="index.html" class="dropdown-item"><i class="fa-solid fa-right-from-bracket"></i> Log-out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <nav class="side-nav">
                <div class="menu-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="Dashboard_PRTracker.html">PR tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_POTracker.html">PO Tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_Payment.html">Payment</a></div>
                <div class="sub-menu"><a href="Dashboard_Savings.html">Savings</a></div>
                <div class="sub-menu"><a href="Dashboard_DeliveryTracker.html">Delivery Tracker</a></div>

                <div class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <a href="Supplier.html">Supplier</a>
                </div>
                
                <div class="menu-item">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>Inventory</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="#">YTD</a></div>
                <div class="sub-menu"><a href="#">Products</a></div>
                <div class="sub-menu"><a href="#">Stock In</a></div>
                <div class="sub-menu"><a href="#">Stock Out</a></div>
                <div class="sub-menu"><a href="#">Pull-Out Supplies</a></div>
            </nav>
        </aside>

        <main class="content-area">
            <h2 style="margin-bottom: 30px;">
                <span style="color: var(--primary-orange);">■</span> <span id="page-title">Profile</span>
            </h2>

          <form id="profileForm" class="profile-card">
    <div class="profile-left">
        <div class="avatar-wrapper" id="avatarClickArea" style="cursor: pointer;">
            <div class="camera-overlay"><i class="fa-solid fa-camera"></i></div>
            <img src="Assets/user-placeholder.png" id="profileDisplay" alt="Profile Image">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </div>

        <div class="button-group-left">
            <button type="submit" class="btn-save" id="saveBtn">SAVE</button>
            <button type="button" class="btn-cancel" onclick="window.location.reload()">CANCEL</button>
        </div>
    </div>

    <div class="profile-right">
        <div class="input-row">
            <label>Name:</label>
            <input type="text" id="userName" placeholder="Enter your full name" required>
        </div>
        <div class="input-row">
            <label>Email:</label>
            <input type="email" id="userEmail" placeholder="Enter your email address" required>
        </div>
        <div class="input-row">
            <label>Phone Number:</label>
            <input type="tel" id="userPhone" placeholder="Enter your phone number" required>
        </div>
        <div class="input-row">
            <label>Address:</label>
            <input type="text" id="userAddress" placeholder="Enter your complete address" required>
        </div>

        <div class="button-group-right">
            <button type="button" id="editBtn" class="btn-save">EDIT PROFILE</button>
        </div>
    </div>
</form>
        </main>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const imageInput = document.getElementById('imageInput');
        const profileDisplay = document.getElementById('profileDisplay');
        const avatarClickArea = document.getElementById('avatarClickArea');
        const saveBtn = document.getElementById('saveBtn');

        // --- 1. Image Upload & Preview ---
        avatarClickArea.addEventListener('click', () => {
            imageInput.click(); // Trigger the hidden file input
        });

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Update the image src with the uploaded file
                    profileDisplay.setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 2. Validation & Saving ---
        saveBtn.addEventListener('click', () => {
            const name = document.querySelector('input[type="text"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const phone = document.querySelectorAll('input[type="text"]')[1].value;

            // Simple Regex for Email Validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (name.length < 2) {
                alert("Please enter a valid name.");
                return;
            }

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return;
            }

            if (phone.length < 8) {
                alert("Please enter a valid phone number.");
                return;
            }

            // Simulate a Save Action
            saveBtn.innerText = "SAVING...";
            saveBtn.disabled = true;

            setTimeout(() => {
                alert("Profile updated successfully!");
                saveBtn.innerText = "SAVE";
                saveBtn.disabled = false;
            }, 1000);
        });
    });
</script>

<script>
document.querySelectorAll('.side-nav .menu-item').forEach(item => {
    // 1. Initial State: Hide sub-menus on page load (Optional)
    toggleSubMenus(item, false); 

    item.style.cursor = 'pointer'; // Ensure user knows it's clickable

    item.addEventListener('click', function() {
        // Toggle the caret rotation
        const caret = this.querySelector('.caret');
        if (caret) {
            caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
            caret.style.transition = 'transform 0.3s ease';
        }

        // Check current state of the first sub-menu item to determine if we show or hide
        const firstSub = this.nextElementSibling;
        const isHidden = !firstSub || firstSub.style.display === 'none';
        
        toggleSubMenus(this, isHidden);
    });
});

function toggleSubMenus(menuItem, show) {
    let next = menuItem.nextElementSibling;
    
    while (next && (next.classList.contains('sub-menu') || next.classList.contains('active-tab'))) {
        next.style.display = show ? 'block' : 'none';
        next = next.nextElementSibling;
    }
}

//=============================================////=============================================//
//=============================================////=============================================//

// --- Header Dropdown Logic ---
const profileBtn = document.getElementById('profileDropdown');
const notifBtn = document.getElementById('notifDropdown');

// Toggle Profile Menu
profileBtn.onclick = (e) => {
    e.stopPropagation();
    notifBtn.querySelector('.dropdown-menu').classList.remove('show'); // Close other
    profileBtn.querySelector('.dropdown-menu').classList.toggle('show');
};

// Toggle Notification Menu
notifBtn.onclick = (e) => {
    e.stopPropagation();
    profileBtn.querySelector('.dropdown-menu').classList.remove('show'); // Close other
    notifBtn.querySelector('.dropdown-menu').classList.toggle('show');
};

// Close menus when clicking anywhere else on the page
window.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        menu.classList.remove('show');
    });
});
</script>

</body>
</html>
