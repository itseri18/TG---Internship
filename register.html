<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TGFSI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form class="form-card" id="registrationForm">
            <h2>Create <span class="highlight">Account</span></h2>
            <p>Join our community today</p>
            
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="email@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">Sign Up</button>
            
            <p class="switch-text">
                Already have an account? <a href="index.html">Login</a>
            </p>
        </form>
    </div>

    <script>
        // Simple client-side validation logic
        const form = document.getElementById('registrationForm');
        
        form.addEventListener('submit', (e) => {
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                e.preventDefault(); // Stop form from submitting
                alert("Passwords do not match! Please try again.");
            } else {
                alert("Registration successful! (Demo only)");
            }
        });
    </script>
</body>
</html>
