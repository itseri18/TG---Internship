<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | TGFSI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="Calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-left">
            <img src="Assets/logo.png" alt="" class="header-logo">
        </div>
        <div class="header-right">
            <div class="dropdown-container" id="notifDropdown">
                <i class="fa-solid fa-bell notification-icon"></i>
                <div class="dropdown-menu">
                    <div class="dropdown-item">No new notifications</div>
                </div>
            </div>

            <div class="profile-icon dropdown-container" id="profileDropdown">
                <i class="fa-solid fa-circle-user"></i>
                <div class="dropdown-menu">
                    <a href="Profile.html" class="dropdown-item"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="Calendar.html" class="dropdown-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
                    <a href="index.html" class="dropdown-item"><i class="fa-solid fa-right-from-bracket"></i> Log-out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <nav class="side-nav">
                <div class="menu-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="Dashboard_PRTracker.html">PR tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_POTracker.html">PO Tracker</a></div>
                <div class="sub-menu"><a href="Dashboard_Payment.html">Payment</a></div>
                <div class="sub-menu"><a href="Dashboard_Savings.html">Savings</a></div>
                <div class="sub-menu"><a href="Dashboard_DeliveryTracker.html">Delivery Tracker</a></div>

                <div class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <a href="Supplier.html">Supplier</a>
                </div>
                
                <div class="menu-item">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>Inventory</span>
                    <i class="fa-solid fa-chevron-down caret"></i>
                </div>
                <div class="sub-menu"><a href="#">YTD</a></div>
                <div class="sub-menu"><a href="#">Products</a></div>
                <div class="sub-menu"><a href="#">Stock In</a></div>
                <div class="sub-menu"><a href="#">Stock Out</a></div>
                <div class="sub-menu"><a href="#">Pull-Out Supplies</a></div>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        <section class="flex-1 p-6 md:p-8 overflow-y-auto custom-scrollbar bg-white">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 id="currentMonthYear" class="text-2xl font-bold text-gray-800">April 2026</h2>
                    <p class="text-gray-500 text-sm">Manage your facility schedule</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button onclick="changeMonth(-1)" class="px-3 py-1.5 hover:bg-white rounded-md transition-all"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                        <button onclick="changeMonth(1)" class="px-3 py-1.5 hover:bg-white rounded-md transition-all"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                    </div>
                    <button onclick="goToToday()" class="text-sm font-bold text-orange-500 hover:underline">Today</button>
                </div>
            </div>

            <div class="border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
                <div class="grid grid-cols-7 bg-gray-50 border-b border-gray-100">
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Sun</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mon</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tue</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Wed</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Thu</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Fri</div>
                    <div class="py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Sat</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 bg-white"></div>
            </div>
        </section>

        <section class="w-full lg:w-[380px] bg-gray-50 border-l border-gray-200 p-8 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-bold text-lg text-gray-800">Upcoming Activities</h3>
                <span id="eventCountBadge" class="bg-orange-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            <div id="activityList" class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-4"></div>
        </section>
    </main>
</div>

<button onclick="openModal()" class="fixed bottom-8 right-8 w-14 h-14 bg-orange-500 hover:bg-orange-600 text-white rounded-full shadow-lg shadow-orange-200 flex items-center justify-center text-2xl transition-all hover:scale-110 active:scale-95 z-">
    <i class="fa-solid fa-plus"></i>
</button>

<div id="eventModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden items-center justify-center z- p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0" id="modalBox">
        <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Create Event</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-8 space-y-5">
            <input type="hidden" id="editIndex">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Event Title</label>
                <input type="text" id="eventTitle" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Date</label>
                <input type="date" id="eventDate" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Status</label>
                <select id="eventStatus" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                    <option value="Upcoming">Upcoming</option>
                    <option value="Done">Done</option>
                    <option value="Overdue">Overdue</option>
                </select>
            </div>
            <div class="pt-4 flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 text-gray-500 font-semibold hover:bg-gray-100 rounded-xl transition-all">Cancel</button>
                <button onclick="saveEvent()" class="flex-1 py-3 bg-orange-500 text-white font-bold rounded-xl shadow-md hover:bg-orange-600 transition-all">Save Event</button>
            </div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'pro_events_v1';
    let events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
        { title: "Project Kickoff", date: "2026-04-01", status: "Done" },
        { title: "Design Review", date: "2026-04-12", status: "Upcoming" },
        { title: "Safety Audit", date: "2026-04-21", status: "Overdue" }
    ];

    let currentDisplayDate = new Date(2026, 3, 1); // Start at April 2026

    function init() {
        renderCalendar();
        renderActivityFeed();
    }

    function changeMonth(offset) {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + offset);
        renderCalendar();
    }

    function goToToday() {
        currentDisplayDate = new Date();
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthYearLabel = document.getElementById('currentMonthYear');
        grid.innerHTML = '';
        
        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth();
        
        monthYearLabel.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDisplayDate);

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const today = new Date();

        // Previous Month "Padding" Days
        for (let i = firstDayOfMonth; i > 0; i--) {
            const day = daysInPrevMonth - i + 1;
            const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            grid.innerHTML += createDayHTML(day, dateStr, false, false);
        }

        // Current Month Days
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
            grid.innerHTML += createDayHTML(d, dateStr, true, isToday);
        }

        // Next Month "Padding" Days
        const totalSlots = 42; // 6 rows of 7 days
        const remainingSlots = totalSlots - (firstDayOfMonth + daysInMonth);
        for (let i = 1; i <= remainingSlots; i++) {
            const dateStr = `${year}-${String(month + 2).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            grid.innerHTML += createDayHTML(i, dateStr, false, false);
        }
    }

    function createDayHTML(day, dateStr, isCurrentMonth, isToday) {
        const dayEvents = events.filter(e => e.date === dateStr);
        const opacityClass = isCurrentMonth ? '' : 'bg-gray-50/50 text-gray-300';
        
        return `
            <div class="h-24 md:h-32 border-b border-r border-gray-100 p-2 group hover:bg-orange-50/30 transition-colors cursor-pointer relative ${opacityClass}" onclick="openDateModal('${dateStr}')">
                <span class="text-sm font-bold ${isToday ? 'bg-orange-500 text-white w-7 h-7 flex items-center justify-center rounded-full shadow-md' : 'text-gray-400 group-hover:text-gray-800'} transition-all">${day}</span>
                <div class="mt-1 space-y-1">
                    ${dayEvents.slice(0, 2).map(e => {
                        let colorClass = e.status === 'Done' ? 'bg-green-100 text-green-700 border-green-200' : 
                                         (e.status === 'Overdue' ? 'bg-red-100 text-red-700 border-red-200' : 
                                         'bg-orange-100 text-orange-700 border-orange-200');
                        return `<div class="text-[9px] px-1.5 py-0.5 rounded font-bold truncate border ${colorClass}">${e.title}</div>`;
                    }).join('')}
                    ${dayEvents.length > 2 ? `<div class="text-[9px] text-gray-400 font-bold pl-1">+${dayEvents.length - 2} more</div>` : ''}
                </div>
            </div>
        `;
    }

    // Modal & Event Logic (Save/Delete/Edit)
    function openModal(idx = null) {
        const modal = document.getElementById('eventModal');
        const box = document.getElementById('modalBox');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);

        if(idx !== null) {
            document.getElementById('modalTitle').innerText = "Edit Activity";
            document.getElementById('eventTitle').value = events[idx].title;
            document.getElementById('eventDate').value = events[idx].date;
            document.getElementById('eventStatus').value = events[idx].status;
            document.getElementById('editIndex').value = idx;
        } else {
            document.getElementById('modalTitle').innerText = "Create Event";
            document.getElementById('editIndex').value = "";
        }
    }

    function openDateModal(date) { openModal(); document.getElementById('eventDate').value = date; }

    function closeModal() {
        const modal = document.getElementById('eventModal');
        const box = document.getElementById('modalBox');
        box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
    }

    function saveEvent() {
        const title = document.getElementById('eventTitle').value;
        const date = document.getElementById('eventDate').value;
        const status = document.getElementById('eventStatus').value;
        const idx = document.getElementById('editIndex').value;

        if(!title || !date) return alert("Please provide a title and date.");

        if(idx !== "") events[idx] = { title, date, status };
        else events.push({ title, date, status });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        closeModal();
        renderCalendar();
        renderActivityFeed();
    }

    function deleteEvent(idx) {
        if(confirm("Delete this activity?")) {
            events.splice(idx, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            renderCalendar();
            renderActivityFeed();
        }
    }

    function renderActivityFeed() {
        const list = document.getElementById('activityList');
        const badge = document.getElementById('eventCountBadge');
        list.innerHTML = '';
        events.sort((a,b) => new Date(a.date) - new Date(b.date));
        badge.innerText = events.length;

        if(events.length === 0) {
            list.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">No activities.</div>`;
            return;
        }

        events.forEach((ev, idx) => {
            list.innerHTML += `
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-all group">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold uppercase px-2 py-1 rounded-lg bg-orange-50 text-orange-500">${ev.status}</span>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openModal(${idx})" class="text-gray-400 hover:text-orange-500"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteEvent(${idx})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <h4 class="font-bold text-gray-800">${ev.title}</h4>
                    <p class="text-xs text-gray-400 mt-1">${new Date(ev.date).toLocaleDateString()}</p>
                </div>
            `;
        });
    }

    window.onload = init;
</script>

<script>
document.querySelectorAll('.side-nav .menu-item').forEach(item => {
    // 1. Initial State: Hide sub-menus on page load (Optional)
    toggleSubMenus(item, false); 

    item.style.cursor = 'pointer'; // Ensure user knows it's clickable

    item.addEventListener('click', function() {
        // Toggle the caret rotation
        const caret = this.querySelector('.caret');
        if (caret) {
            caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
            caret.style.transition = 'transform 0.3s ease';
        }

        // Check current state of the first sub-menu item to determine if we show or hide
        const firstSub = this.nextElementSibling;
        const isHidden = !firstSub || firstSub.style.display === 'none';
        
        toggleSubMenus(this, isHidden);
    });
});

function toggleSubMenus(menuItem, show) {
    let next = menuItem.nextElementSibling;
    
    while (next && (next.classList.contains('sub-menu') || next.classList.contains('active-tab'))) {
        next.style.display = show ? 'block' : 'none';
        next = next.nextElementSibling;
    }
}

//=============================================////=============================================//
//=============================================////=============================================//

// --- Header Dropdown Logic ---
const profileBtn = document.getElementById('profileDropdown');
const notifBtn = document.getElementById('notifDropdown');

// Toggle Profile Menu
profileBtn.onclick = (e) => {
    e.stopPropagation();
    notifBtn.querySelector('.dropdown-menu').classList.remove('show'); // Close other
    profileBtn.querySelector('.dropdown-menu').classList.toggle('show');
};

// Toggle Notification Menu
notifBtn.onclick = (e) => {
    e.stopPropagation();
    profileBtn.querySelector('.dropdown-menu').classList.remove('show'); // Close other
    notifBtn.querySelector('.dropdown-menu').classList.toggle('show');
};

// Close menus when clicking anywhere else on the page
window.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        menu.classList.remove('show');
    });
});
</script>

</body>
</html>
